- name: Configure the VPS
  hosts: all
  become: true
  tasks:
    # The only tasks a first run from a laptop needs (--tags ci): after that, CI applies everything.
    - name: Create the CI user
      ansible.builtin.user:
        name: ci
        shell: /bin/bash
      tags: [ci]

    - name: Let CI in with its own key only
      ansible.posix.authorized_key:
        user: ci
        key: "{{ lookup('ansible.builtin.file', 'ci.pub') }}"
        exclusive: true
      tags: [ci]

    - name: Let CI run Ansible as root
      ansible.builtin.copy:
        dest: /etc/sudoers.d/ci
        content: "ci ALL=(ALL) NOPASSWD:ALL\n"
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
      tags: [ci]

    # Written before the install, so Docker starts with it.
    - name: Create the Docker config directory
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        mode: "0700"

    - name: Rotate container logs
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: '{ "log-driver": "local" }'
        mode: "0600"
      notify: Restart docker

    - name: Install packages
      ansible.builtin.apt:
        # Ubuntu's own Docker packages: no third-party repository, security fixes come with unattended-upgrades.
        name: [docker.io, docker-compose-v2, ufw, unattended-upgrades]
        update_cache: true
        cache_valid_time: 3600

    - name: Harden SSH
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-hardening.conf
        # sshd keeps the first value it reads: 00- wins over 50-cloud-init.conf.
        content: |
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
        mode: "0600"
        validate: /usr/sbin/sshd -t -f %s
      notify: Reload ssh

    - name: Create the deploy user
      ansible.builtin.user:
        name: deploy
        groups: docker
        append: true
        shell: /bin/bash

    - name: Allow SSH, HTTP and HTTPS
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: ["22", "80", "443"]

    - name: Deny every other incoming connection
      community.general.ufw:
        state: enabled
        direction: incoming
        policy: deny

    - name: Reboot at night when an update needs it
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
        content: |
          Unattended-Upgrade::Automatic-Reboot "true";
          Unattended-Upgrade::Automatic-Reboot-Time "04:00";
        mode: "0644" # NOSONAR apt also reads its config as a regular user

    - name: Look up the docker group
      ansible.builtin.getent:
        database: group
        key: docker

    - name: Copy the stacks
      ansible.builtin.copy:
        src: ../stacks/
        dest: /srv/stacks/
        mode: u=rwX,g=rX,o=rX # NOSONAR public files from this repo, read by containers running as non-root
        directory_mode: "0755" # NOSONAR same as above

    - name: Give the socket proxy the docker group
      ansible.builtin.copy:
        dest: /srv/stacks/traefik/.env
        content: "DOCKER_GID={{ ansible_facts.getent_group.docker[1] }}\n"
        mode: "0600"

    - name: Start the stacks
      community.docker.docker_compose_v2:
        project_src: /srv/stacks/{{ item }}
        remove_orphans: true
      # Traefik first: it creates the edge network the other stacks join.
      loop: [traefik, hello]
      # In --check mode the stacks are not really copied yet.
      ignore_errors: "{{ ansible_check_mode }}"

  handlers:
    - name: Reload ssh
      ansible.builtin.service:
        name: ssh
        state: reloaded

    - name: Restart docker
      ansible.builtin.service:
        name: docker
        state: restarted
      # In --check mode Docker is not really installed yet.
      ignore_errors: "{{ ansible_check_mode }}"
