- name: Configure the VPS
  hosts: all
  become: true
  vars:
    alert_email: "{{ lookup('ansible.builtin.env', 'ALERT_EMAIL') }}"
    # Files whose content restarts the monitoring containers: Compose does not notice a bind-mounted file changing.
    monitoring_configs:
      - ../stacks/monitoring/prometheus/prometheus.yml
      - ../stacks/monitoring/prometheus/rules.yml
      - ../stacks/monitoring/blackbox/blackbox.yml
      - ../stacks/monitoring/grafana/provisioning/datasources/prometheus.yml
      - ../stacks/monitoring/grafana/provisioning/dashboards/dashboards.yml
      - ../stacks/monitoring/grafana/dashboards/overview.json
    crowdsec_configs:
      - ../stacks/crowdsec/acquis.yaml
  tasks:
    # The only tasks a first run from a laptop needs (--tags ci): after that, CI applies everything.
    - name: Create the CI user
      ansible.builtin.user:
        name: ci
        shell: /bin/bash
      tags: [ci]

    - name: Let CI in with its own key only
      ansible.posix.authorized_key:
        user: ci
        # A full path lets --check preview the key before the user exists.
        path: /home/ci/.ssh/authorized_keys
        key: "{{ lookup('ansible.builtin.file', 'ci.pub') }}"
        exclusive: true
      tags: [ci]

    - name: Let CI run Ansible as root
      ansible.builtin.copy:
        dest: /etc/sudoers.d/ci
        content: "ci ALL=(ALL) NOPASSWD:ALL\n"
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
      tags: [ci]

    # Written before the install, so Docker starts with it.
    - name: Create the Docker config directory
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        mode: "0700"

    - name: Rotate container logs
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: '{ "log-driver": "local" }'
        mode: "0600"
      notify: Restart docker

    - name: Install packages
      ansible.builtin.apt:
        # Ubuntu's own Docker packages: no third-party repository, security fixes come with unattended-upgrades.
        name: [docker.io, docker-compose-v2, ufw, unattended-upgrades]
        update_cache: true
        cache_valid_time: 3600

    - name: Harden SSH
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-hardening.conf
        # sshd keeps the first value it reads: 00- wins over 50-cloud-init.conf.
        content: |
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
        mode: "0600"
        validate: /usr/sbin/sshd -t -f %s
      notify: Reload ssh

    - name: Create the deploy user
      ansible.builtin.user:
        name: deploy
        groups: docker
        append: true
        shell: /bin/bash

    # `deploy` is in the docker group, which is root-equivalent: its key can only run this script (ADR 0009).
    - name: Install the app deploy command
      ansible.builtin.copy:
        dest: /usr/local/bin/deploy-app
        content: |
          #!/bin/sh
          set -eu
          case "${SSH_ORIGINAL_COMMAND:-}" in
            ds) ;;
            *) echo "unknown stack" >&2; exit 1 ;;
          esac
          # The service has the name of its stack. The new container starts next to the old one, and the old one
          # goes once the new one is healthy: Traefik only routes to healthy containers, so nothing is dropped.
          stack=$SSH_ORIGINAL_COMMAND
          compose="docker compose -f /srv/stacks/$stack/compose.yaml"
          old=$($compose ps -q "$stack")
          $compose pull
          $compose up -d --no-recreate --scale "$stack=$(($(echo "$old" | wc -w) + 1))" --wait --wait-timeout 90
          # shellcheck disable=SC2086
          [ -z "$old" ] || docker rm -f $old
        mode: "0755" # NOSONAR the command is public, only the key that can run it is secret

    - name: Let the deploy workflow run that command and nothing else
      ansible.posix.authorized_key:
        user: deploy
        path: /home/deploy/.ssh/authorized_keys
        key: "{{ lookup('ansible.builtin.file', 'deploy-app.pub') }}"
        key_options: restrict,command="/usr/local/bin/deploy-app"
        exclusive: true

    - name: Allow SSH, HTTP and HTTPS
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: ["22", "80", "443"]

    - name: Deny every other incoming connection
      community.general.ufw:
        state: enabled
        direction: incoming
        policy: deny

    - name: Reboot at night when an update needs it
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
        content: |
          Unattended-Upgrade::Automatic-Reboot "true";
          Unattended-Upgrade::Automatic-Reboot-Time "04:00";
        mode: "0644" # NOSONAR apt also reads its config as a regular user

    - name: Look up the docker group
      ansible.builtin.getent:
        database: group
        key: docker

    - name: Copy the stacks
      ansible.builtin.copy:
        src: ../stacks/
        dest: /srv/stacks/
        mode: u=rwX,g=rX,o=rX # NOSONAR public files from this repo, read by containers running as non-root
        directory_mode: "0755" # NOSONAR same as above

    - name: Give the socket proxy the docker group
      ansible.builtin.copy:
        dest: /srv/stacks/traefik/.env
        content: "DOCKER_GID={{ ansible_facts.getent_group.docker[1] }}\n"
        mode: "0600"

    - name: Check the alert settings
      ansible.builtin.assert:
        that: alert_email | length > 0
        fail_msg: Set the ALERT_EMAIL repository variable, it is where Alertmanager sends alerts.
        quiet: true

    - name: Create the Traefik log directory
      ansible.builtin.file:
        path: /srv/stacks/traefik/logs
        state: directory
        owner: root
        group: root
        mode: "0750"

    # Traefik does not rotate its logs. copytruncate: it keeps writing to the same file.
    - name: Rotate the Traefik access log
      ansible.builtin.copy:
        dest: /etc/logrotate.d/traefik
        content: |
          /srv/stacks/traefik/logs/access.log {
              daily
              maxsize 50M
              rotate 3
              compress
              copytruncate
              missingok
              notifempty
          }
        mode: "0644" # NOSONAR logrotate reads it as root, nothing secret in it

    - name: Look up the adm group
      ansible.builtin.getent:
        database: group
        key: adm

    - name: Write the CrowdSec settings
      ansible.builtin.copy:
        dest: /srv/stacks/crowdsec/.env
        content: |
          ADM_GID={{ ansible_facts.getent_group.adm[1] }}
          CONFIG_HASH={{ config_hash }}
        owner: root
        group: root
        mode: "0600"
      vars:
        config_hash: "{{ query('ansible.builtin.file', *crowdsec_configs) | join | hash('sha1') }}"
      diff: false

    - name: Create the Traefik secrets directory
      ansible.builtin.file:
        path: /srv/stacks/traefik/secrets
        state: directory
        owner: root
        group: root
        mode: "0700"

    # One key, two readers: Traefik's bouncer sends it, CrowdSec registers it as a bouncer at startup.
    - name: Store the CrowdSec bouncer key
      ansible.builtin.copy:
        dest: "{{ item.dest }}"
        content: "{{ item.content }}"
        owner: root
        group: root
        mode: "0600"
      loop:
        - { dest: /srv/stacks/traefik/secrets/crowdsec_bouncer_key, content: "{{ bouncer_key }}" }
        - { dest: /srv/stacks/crowdsec/bouncer.env, content: "BOUNCER_KEY_TRAEFIK={{ bouncer_key }}\n" }
      vars:
        bouncer_key: "{{ (lookup('community.sops.sops', playbook_dir ~ '/../secrets/production.sops.yaml') | from_yaml).CROWDSEC_BOUNCER_KEY }}"
      no_log: true
      # shortcut: same as the SMTP password, the dry run has no age key and a rotation needs the workflow run with `force`.
      when: not ansible_check_mode

    - name: Create the monitoring directories
      ansible.builtin.file:
        path: /srv/stacks/monitoring/{{ item.path }}
        state: directory
        owner: root
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: alertmanager, group: "65534", mode: "0750" }
        - { path: secrets, group: root, mode: "0700" }

    # Group 65534 is `nobody`, the user the Alertmanager image runs as.
    - name: Render the Alertmanager config
      ansible.builtin.template:
        src: alertmanager.yml.j2
        dest: /srv/stacks/monitoring/alertmanager/alertmanager.yml
        owner: root
        group: "65534"
        mode: "0640"
      # The run summary is public and the config holds the address.
      diff: false

    - name: Store the SMTP password for Alertmanager
      ansible.builtin.copy:
        dest: /srv/stacks/monitoring/secrets/smtp_password
        content: "{{ (lookup('community.sops.sops', playbook_dir ~ '/../secrets/production.sops.yaml') | from_yaml).SMTP_PASSWORD }}"
        owner: root
        group: "65534"
        mode: "0440"
      no_log: true
      # shortcut: the dry run has no age key, so the password is only read and written for real.
      # A rotation does not show in the diff: run the workflow by hand with `force`.
      when: not ansible_check_mode

    - name: Write the monitoring settings
      ansible.builtin.copy:
        dest: /srv/stacks/monitoring/.env
        content: "CONFIG_HASH={{ config_hash }}\n"
        owner: root
        group: root
        mode: "0600"
      vars:
        config_hash: >-
          {{ (query('ansible.builtin.file', *monitoring_configs)
          + [lookup('ansible.builtin.template', 'alertmanager.yml.j2')]) | join | hash('sha1') }}
      diff: false

    - name: Start the stacks
      community.docker.docker_compose_v2:
        project_src: /srv/stacks/{{ item }}
        remove_orphans: true
      # Traefik first: it creates the edge network the other stacks join.
      loop: [traefik, crowdsec, hello, ds, monitoring]
      # In --check mode the stacks are not really copied yet.
      ignore_errors: "{{ ansible_check_mode }}"

  handlers:
    - name: Reload ssh
      ansible.builtin.service:
        name: ssh
        state: reloaded

    - name: Restart docker
      ansible.builtin.service:
        name: docker
        state: restarted
      # In --check mode Docker is not really installed yet.
      ignore_errors: "{{ ansible_check_mode }}"
