- name: Configure the VPS
  hosts: all
  become: true
  tasks:
    # Written before the install, so Docker starts with it.
    - name: Create the Docker config directory
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        mode: "0755"

    - name: Rotate container logs
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: '{ "log-driver": "local" }'
        mode: "0644"
      notify: Restart docker

    - name: Install packages
      ansible.builtin.apt:
        # Ubuntu's own Docker packages: no third-party repository, security fixes come with unattended-upgrades.
        name: [docker.io, docker-compose-v2, ufw, unattended-upgrades]
        update_cache: true
        cache_valid_time: 3600

    - name: Harden SSH
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-hardening.conf
        # sshd keeps the first value it reads: 00- wins over 50-cloud-init.conf.
        content: |
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      notify: Reload ssh

    - name: Create the deploy user
      ansible.builtin.user:
        name: deploy
        groups: docker
        append: true
        shell: /bin/bash

    - name: Allow SSH, HTTP and HTTPS
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: ["22", "80", "443"]

    - name: Deny every other incoming connection
      community.general.ufw:
        state: enabled
        direction: incoming
        policy: deny

    - name: Reboot at night when an update needs it
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
        content: |
          Unattended-Upgrade::Automatic-Reboot "true";
          Unattended-Upgrade::Automatic-Reboot-Time "04:00";
        mode: "0644"

  handlers:
    - name: Reload ssh
      ansible.builtin.service:
        name: ssh
        state: reloaded

    - name: Restart docker
      ansible.builtin.service:
        name: docker
        state: restarted
      # In --check mode Docker is not really installed yet.
      ignore_errors: "{{ ansible_check_mode }}"
