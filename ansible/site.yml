- name: Configure the VPS
  hosts: all
  become: true
  vars:
    alert_email: "{{ lookup('ansible.builtin.env', 'ALERT_EMAIL') }}"
    # The link of the public dashboard: public by nature, it is in every URL a visitor sees.
    public_dashboard_token: 6f1c0d2e9b7a4c35a8e1f0b2d4c6e8a1 # gitleaks:allow
    # Files whose content restarts the monitoring containers: Compose does not notice a bind-mounted file changing.
    monitoring_configs:
      - ../stacks/monitoring/prometheus/prometheus.yml
      - ../stacks/monitoring/prometheus/rules.yml
      - ../stacks/monitoring/blackbox/blackbox.yml
      - ../stacks/monitoring/grafana/provisioning/datasources/prometheus.yml
      - ../stacks/monitoring/grafana/provisioning/dashboards/dashboards.yml
      - ../stacks/monitoring/grafana/dashboards/overview.json
      - ../stacks/monitoring/grafana/dashboards/security.json
      - ../stacks/monitoring/grafana/dashboards/public.json
    crowdsec_configs:
      - ../stacks/crowdsec/acquis.yaml
      - ../stacks/crowdsec/appsec/crs-inband.yaml
      - ../stacks/crowdsec/config.yaml.local
    hello_configs:
      - ../stacks/hello/nginx/default.conf
    fw_bouncer:
      version: v0.0.36
      sha256: f86e4b72693549d99f40a9402abefb894108f047a3fbe6e72fada25ee17ce88b
  tasks:
    # The only tasks a first run from a laptop needs (--tags ci): after that, CI applies everything.
    - name: Create the CI user
      ansible.builtin.user:
        name: ci
        shell: /bin/bash
      tags: [ci]

    - name: Let CI in with its own key only
      ansible.posix.authorized_key:
        user: ci
        # A full path lets --check preview the key before the user exists.
        path: /home/ci/.ssh/authorized_keys
        key: "{{ lookup('ansible.builtin.file', 'ci.pub') }}"
        exclusive: true
      tags: [ci]

    - name: Let CI run Ansible as root
      ansible.builtin.copy:
        dest: /etc/sudoers.d/ci
        content: "ci ALL=(ALL) NOPASSWD:ALL\n"
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
      tags: [ci]

    # Written before the install, so Docker starts with it.
    - name: Create the Docker config directory
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        mode: "0700"

    - name: Rotate container logs
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: '{ "log-driver": "local" }'
        mode: "0600"
      notify: Restart docker

    - name: Install packages
      ansible.builtin.apt:
        # Ubuntu's own Docker packages: no third-party repository, security fixes come with unattended-upgrades.
        name: [docker.io, docker-compose-v2, ufw, unattended-upgrades]
        update_cache: true
        cache_valid_time: 3600

    - name: Harden SSH
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-hardening.conf
        # sshd keeps the first value it reads: 00- wins over 50-cloud-init.conf.
        content: |
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
        mode: "0600"
        validate: /usr/sbin/sshd -t -f %s
      notify: Reload ssh

    - name: Create the deploy user
      ansible.builtin.user:
        name: deploy
        groups: docker
        append: true
        shell: /bin/bash

    # `deploy` is in the docker group, which is root-equivalent: its key can only run this script (ADR 0009).
    - name: Install the app deploy command
      ansible.builtin.copy:
        src: ../scripts/deploy-app
        dest: /usr/local/bin/deploy-app
        mode: "0755" # NOSONAR the command is public, only the key that can run it is secret

    - name: Let the deploy workflow run that command and nothing else
      ansible.posix.authorized_key:
        user: deploy
        path: /home/deploy/.ssh/authorized_keys
        key: "{{ lookup('ansible.builtin.file', 'deploy-app.pub') }}"
        key_options: restrict,command="/usr/local/bin/deploy-app"
        exclusive: true

    - name: Allow SSH, HTTP and HTTPS
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: ["22", "80", "443"]

    - name: Deny every other incoming connection
      community.general.ufw:
        state: enabled
        direction: incoming
        policy: deny

    - name: Reboot at night when an update needs it
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
        content: |
          Unattended-Upgrade::Automatic-Reboot "true";
          Unattended-Upgrade::Automatic-Reboot-Time "04:00";
        mode: "0644" # NOSONAR apt also reads its config as a regular user

    - name: Look up the docker group
      ansible.builtin.getent:
        database: group
        key: docker

    - name: Copy the stacks
      ansible.builtin.copy:
        src: ../stacks/
        dest: /srv/stacks/
        mode: u=rwX,g=rX,o=rX # NOSONAR public files from this repo, read by containers running as non-root
        directory_mode: "0755" # NOSONAR same as above

    - name: Give the socket proxy the docker group
      ansible.builtin.copy:
        dest: /srv/stacks/traefik/.env
        content: "DOCKER_GID={{ ansible_facts.getent_group.docker[1] }}\n"
        mode: "0600"

    - name: Check the alert settings
      ansible.builtin.assert:
        that: alert_email | length > 0
        fail_msg: Set the ALERT_EMAIL repository variable, it is where Alertmanager sends alerts.
        quiet: true

    - name: Create the Traefik log directory
      ansible.builtin.file:
        path: /srv/stacks/traefik/logs
        state: directory
        owner: root
        group: root
        mode: "0750"

    # Traefik does not rotate its logs. copytruncate: it keeps writing to the same file.
    - name: Rotate the Traefik access log
      ansible.builtin.copy:
        dest: /etc/logrotate.d/traefik
        content: |
          /srv/stacks/traefik/logs/access.log {
              daily
              maxsize 50M
              rotate 3
              compress
              copytruncate
              missingok
              notifempty
          }
        mode: "0644" # NOSONAR logrotate reads it as root, nothing secret in it

    - name: Look up the adm group
      ansible.builtin.getent:
        database: group
        key: adm

    - name: Write the CrowdSec settings
      ansible.builtin.copy:
        dest: /srv/stacks/crowdsec/.env
        content: |
          ADM_GID={{ ansible_facts.getent_group.adm[1] }}
          CONFIG_HASH={{ config_hash }}
        owner: root
        group: root
        mode: "0600"
      vars:
        config_hash: "{{ query('ansible.builtin.file', *crowdsec_configs) | join | hash('sha1') }}"
      diff: false

    - name: Create the Traefik secrets directory
      ansible.builtin.file:
        path: /srv/stacks/traefik/secrets
        state: directory
        owner: root
        group: root
        mode: "0700"

    # shortcut: the dry run has no age key, so the keys are only read and written for real.
    # A rotation does not show in the diff: run the workflow by hand with `force`.
    - name: Write the CrowdSec bouncer keys
      when: not ansible_check_mode
      no_log: true
      vars:
        secrets: "{{ lookup('community.sops.sops', playbook_dir ~ '/../secrets/production.sops.yaml') | from_yaml }}"
      block:
        # Traefik's bouncer sends it, CrowdSec registers both bouncers at startup.
        - name: Store the Traefik bouncer key
          ansible.builtin.copy:
            dest: /srv/stacks/traefik/secrets/crowdsec_bouncer_key
            content: "{{ secrets.CROWDSEC_BOUNCER_KEY }}"
            owner: root
            group: root
            mode: "0600"

        - name: Register the bouncers at CrowdSec startup
          ansible.builtin.copy:
            dest: /srv/stacks/crowdsec/bouncer.env
            content: |
              BOUNCER_KEY_TRAEFIK={{ secrets.CROWDSEC_BOUNCER_KEY }}
              BOUNCER_KEY_FIREWALL={{ secrets.CROWDSEC_FIREWALL_BOUNCER_KEY }}
            owner: root
            group: root
            mode: "0600"

        - name: Configure the firewall bouncer
          ansible.builtin.template:
            src: crowdsec-firewall-bouncer.yaml.j2
            dest: /etc/crowdsec-firewall-bouncer.yaml
            owner: root
            group: root
            mode: "0600"
          vars:
            api_key: "{{ secrets.CROWDSEC_FIREWALL_BOUNCER_KEY }}"
          notify: Restart the firewall bouncer

    - name: Write the hello settings
      ansible.builtin.copy:
        dest: /srv/stacks/hello/.env
        content: "CONFIG_HASH={{ config_hash }}\n"
        owner: root
        group: root
        mode: "0600"
      vars:
        config_hash: "{{ query('ansible.builtin.file', *hello_configs) | join | hash('sha1') }}"
      diff: false

    - name: Create the monitoring directories
      ansible.builtin.file:
        path: /srv/stacks/monitoring/{{ item.path }}
        state: directory
        owner: root
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: alertmanager, group: "65534", mode: "0750" }
        - { path: secrets, group: root, mode: "0700" }

    # Group 65534 is `nobody`, the user the Alertmanager image runs as.
    - name: Render the Alertmanager config
      ansible.builtin.template:
        src: alertmanager.yml.j2
        dest: /srv/stacks/monitoring/alertmanager/alertmanager.yml
        owner: root
        group: "65534"
        mode: "0640"
      # The run summary is public and the config holds the address.
      diff: false

    - name: Store the SMTP password for Alertmanager
      ansible.builtin.copy:
        dest: /srv/stacks/monitoring/secrets/smtp_password
        content: "{{ (lookup('community.sops.sops', playbook_dir ~ '/../secrets/production.sops.yaml') | from_yaml).SMTP_PASSWORD }}"
        owner: root
        group: "65534"
        mode: "0440"
      no_log: true
      # shortcut: the dry run has no age key, so the password is only read and written for real.
      # A rotation does not show in the diff: run the workflow by hand with `force`.
      when: not ansible_check_mode

    # Group 0 is the group Grafana's user belongs to.
    - name: Store the Grafana admin password
      ansible.builtin.copy:
        dest: /srv/stacks/monitoring/secrets/grafana_admin_password
        content: "{{ (lookup('community.sops.sops', playbook_dir ~ '/../secrets/production.sops.yaml') | from_yaml).GRAFANA_ADMIN_PASSWORD }}"
        owner: root
        group: root
        mode: "0440"
      no_log: true
      # shortcut: same as the SMTP password, a rotation needs the workflow run with `force`.
      when: not ansible_check_mode

    - name: Create the Redis secrets directory
      ansible.builtin.file:
        path: /srv/stacks/redis/secrets
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Create the semaphore secrets directory
      ansible.builtin.file:
        path: /srv/stacks/semaphore/secrets
        state: directory
        owner: root
        group: root
        mode: "0700"

    # Group 10002 is the one the Redis container runs as: nothing else on the host has it.
    # shortcut: the dry run has no age key, so the password is only read and written for real.
    # A rotation does not show in the diff: run the workflow by hand with `force`.
    - name: Store the Redis password
      when: not ansible_check_mode
      no_log: true
      vars:
        redis_password: "{{ (lookup('community.sops.sops', playbook_dir ~ '/../secrets/production.sops.yaml') | from_yaml).REDIS_PASSWORD }}"
      block:
        - name: Write the Redis password file
          ansible.builtin.copy:
            dest: /srv/stacks/redis/secrets/redis_password
            content: "{{ redis_password }}"
            owner: root
            group: "10002"
            mode: "0440"

        # Valkey reads the password at start only and Compose does not see a bind-mounted file change: the hash in a
        # label makes it recreate Redis when the password does, even if a later task of the run fails.
        - name: Write the Redis settings
          ansible.builtin.copy:
            dest: /srv/stacks/redis/.env
            content: "PASSWORD_HASH={{ redis_password | hash('sha256') }}\n"
            owner: root
            group: root
            mode: "0600"

        # The backend takes its Redis address, password included, from this file (stacks/semaphore). Group 10001 is the
        # one its container runs as, and the hash recreates the replicas when the password changes, like Redis.
        - name: Write the backend's Redis address
          ansible.builtin.copy:
            dest: /srv/stacks/semaphore/secrets/semaphore.redis-url
            content: "redis://:{{ redis_password }}@redis:6379"
            owner: root
            group: "10001"
            mode: "0440"

        - name: Write the semaphore settings
          ansible.builtin.copy:
            dest: /srv/stacks/semaphore/.env
            content: "PASSWORD_HASH={{ redis_password | hash('sha256') }}\n"
            owner: root
            group: root
            mode: "0600"

    - name: Write the monitoring settings
      ansible.builtin.copy:
        dest: /srv/stacks/monitoring/.env
        content: |
          CONFIG_HASH={{ config_hash }}
          PUBLIC_DASHBOARD_TOKEN={{ public_dashboard_token }}
        owner: root
        group: root
        mode: "0600"
      vars:
        config_hash: >-
          {{ (query('ansible.builtin.file', *monitoring_configs)
          + [lookup('ansible.builtin.template', 'alertmanager.yml.j2')]) | join | hash('sha1') }}
      diff: false

    # The release binary, pinned by checksum: no third-party apt repository (ADR 0012).
    - name: Install nftables
      ansible.builtin.apt:
        name: nftables

    - name: Download the firewall bouncer
      ansible.builtin.get_url:
        url: "https://github.com/crowdsecurity/cs-firewall-bouncer/releases/download/{{ fw_bouncer.version }}/crowdsec-firewall-bouncer-linux-amd64.tgz"
        dest: /var/cache/crowdsec-firewall-bouncer-{{ fw_bouncer.version }}.tgz
        checksum: "sha256:{{ fw_bouncer.sha256 }}"
        mode: "0644" # NOSONAR a public release archive

    - name: Unpack the firewall bouncer
      ansible.builtin.unarchive:
        src: /var/cache/crowdsec-firewall-bouncer-{{ fw_bouncer.version }}.tgz
        dest: /opt
        remote_src: true
        owner: root
        group: root
        creates: /opt/crowdsec-firewall-bouncer-{{ fw_bouncer.version }}/crowdsec-firewall-bouncer
      notify: Restart the firewall bouncer
      # In --check mode the archive is not really downloaded yet.
      ignore_errors: "{{ ansible_check_mode }}"

    - name: Run the firewall bouncer as a service
      ansible.builtin.copy:
        dest: /etc/systemd/system/crowdsec-firewall-bouncer.service
        content: |
          [Unit]
          Description=CrowdSec firewall bouncer
          After=network.target docker.service

          [Service]
          Type=notify
          ExecStart=/opt/crowdsec-firewall-bouncer-{{ fw_bouncer.version }}/crowdsec-firewall-bouncer -c /etc/crowdsec-firewall-bouncer.yaml
          # CrowdSec may not answer yet when the host boots: keep trying until its API does.
          Restart=always
          RestartSec=10

          [Install]
          WantedBy=multi-user.target
        mode: "0644" # NOSONAR a systemd unit is readable by everyone
      notify: Restart the firewall bouncer

    - name: Enable the firewall bouncer
      ansible.builtin.systemd_service:
        name: crowdsec-firewall-bouncer
        enabled: true
        daemon_reload: true
      # In --check mode the unit is not really written yet.
      ignore_errors: "{{ ansible_check_mode }}"

    - name: Start the stacks
      community.docker.docker_compose_v2:
        project_src: /srv/stacks/{{ item }}
        remove_orphans: true
      # Traefik first: it creates the edge network the other stacks join. Redis before semaphore: it creates the game one.
      loop: [traefik, crowdsec, hello, ds, redis, semaphore, play, monitoring]
      # In --check mode the stacks are not really copied yet.
      ignore_errors: "{{ ansible_check_mode }}"

    # Grafana cannot provision a public dashboard from a file, only create it through its API (ADR 0014).
    # The call is made on the server, where Grafana listens on localhost: it never goes through Traefik.
    - name: Publish the public dashboard
      when: not ansible_check_mode
      no_log: true
      module_defaults:
        ansible.builtin.uri:
          url_username: admin
          url_password: "{{ (lookup('community.sops.sops', playbook_dir ~ '/../secrets/production.sops.yaml') | from_yaml).GRAFANA_ADMIN_PASSWORD }}"
          force_basic_auth: true
      block:
        - name: Wait for Grafana to provision the dashboard
          ansible.builtin.uri:
            url: http://127.0.0.1:3000/api/dashboards/uid/public
          register: public_dashboard
          until: public_dashboard.status == 200
          retries: 30
          delay: 2
          changed_when: false

        - name: Look for its public link
          ansible.builtin.uri:
            url: http://127.0.0.1:3000/api/dashboards/uid/public/public-dashboards
            status_code: [200, 404]
          register: public_link
          changed_when: false

        # shortcut: a link that exists with another token is kept, a change of token needs it deleted in Grafana first.
        - name: Create it with the token the router expects
          ansible.builtin.uri:
            url: http://127.0.0.1:3000/api/dashboards/uid/public/public-dashboards
            method: POST
            body_format: json
            body:
              accessToken: "{{ public_dashboard_token }}"
              isEnabled: true
              share: public
              timeSelectionEnabled: false
              annotationsEnabled: false
          changed_when: true
          when: public_link.status == 404

  handlers:
    - name: Restart the firewall bouncer
      ansible.builtin.systemd_service:
        name: crowdsec-firewall-bouncer
        state: restarted
      # In --check mode the service is not really installed yet.
      ignore_errors: "{{ ansible_check_mode }}"

    - name: Reload ssh
      ansible.builtin.service:
        name: ssh
        state: reloaded

    - name: Restart docker
      ansible.builtin.service:
        name: docker
        state: restarted
      # In --check mode Docker is not really installed yet.
      ignore_errors: "{{ ansible_check_mode }}"
