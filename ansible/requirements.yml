# The collections come from their GitHub repositories at a pinned commit, not from Galaxy (ADR 0016).
# To bump one: git ls-remote --tags <repo> <tag> '<tag>^{}'  (an annotated tag has two lines: take the one ending in ^{}),
# then paste that commit and the tag in the comment.
