name: crowdsec

# CONFIG_HASH changes when the acquisition file does, which makes Compose recreate the container:
# CrowdSec only reads it at startup, and a single-file mount does not follow Ansible replacing the file.
services:
  crowdsec:
    image: crowdsecurity/crowdsec:v1.8.1
    restart: unless-stopped
    environment:
      # Parsers and scenarios for Traefik access logs and for sshd. The hub is downloaded at first start.
      COLLECTIONS: crowdsecurity/traefik crowdsecurity/sshd
    # Reads /var/log/auth.log, which belongs to group adm: with every capability dropped, being root is not enough.
    group_add: ["${ADM_GID}"]
    volumes:
      - ./acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - config:/etc/crowdsec
      - data:/var/lib/crowdsec/data
      - ../traefik/logs:/var/log/traefik:ro
      # The directory, not the file: rsyslog replaces auth.log when it rotates it, which a file mount would not follow.
      - /var/log:/host/var/log:ro
    # Registers the Traefik bouncer at startup, with the key Ansible wrote from the SOPS file.
    env_file: bouncer.env
    networks: [crowdsec]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    labels:
      config.hash: ${CONFIG_HASH}

volumes:
  config:
  data:

networks:
  crowdsec:
    external: true
