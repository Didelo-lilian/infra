name: hello

# CONFIG_HASH changes when the nginx config does, which makes Compose recreate the container: nginx only reads it at
# startup, and Ansible replacing the file does not restart anything.

services:
  hello:
    image: nginxinc/nginx-unprivileged:1.31.7-alpine
    restart: unless-stopped
    volumes:
      - ./html:/usr/share/nginx/html:ro
      # A directory, not a file: Ansible replaces files atomically, which a file mount would miss.
      - ./nginx:/etc/nginx/conf.d:ro
    tmpfs: [/tmp]
    networks: [edge]
    read_only: true
    security_opt: [no-new-privileges:true]
    labels:
      config.hash: ${CONFIG_HASH}
      traefik.enable: "true"
      traefik.http.routers.hello.rule: Host(`hello.didelo.fr`)
      traefik.http.services.hello.loadbalancer.server.port: "8080"

networks:
  edge:
    external: true
