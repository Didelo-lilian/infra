server {
    listen 8080;

    # No version in the Server header or on error pages.
    server_tokens off;

    # The page has one inline <style>: allowed by its hash, so the inline style is the only thing a script injection could
    # not add. Change the style and this hash changes with it (sha256 of the text between the <style> tags).
    add_header Content-Security-Policy "default-src 'none'; style-src 'sha256-nsylLfANa+4sAUjvw9qqcVn69NdAGX1nsHmOaadkdow='; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
