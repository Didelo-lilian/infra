name: monitoring

x-hardened: &hardened
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]

# CONFIG_HASH changes when a mounted config file does, which makes Compose recreate the containers:
# it does not notice by itself that a bind-mounted file changed.
services:
  prometheus:
    <<: *hardened
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - prometheus-data:/prometheus
      - ./prometheus:/etc/prometheus:ro
    # crowdsec: CrowdSec and Traefik publish their metrics there, nowhere else.
    networks: [monitoring, crowdsec]
    mem_limit: 512m
    labels:
      config.hash: ${CONFIG_HASH}

  blackbox:
    <<: *hardened
    image: prom/blackbox-exporter:v0.29.1
    command: [--config.file=/config/blackbox.yml]
    volumes:
      - ./blackbox:/config:ro
    networks: [monitoring]
    mem_limit: 64m
    labels:
      config.hash: ${CONFIG_HASH}

  node-exporter:
    <<: *hardened
    image: prom/node-exporter:v1.12.1
    command: [--path.rootfs=/host]
    # shortcut: not on the host network, so no per-interface network metrics, upgrade if they are needed.
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks: [monitoring]
    mem_limit: 64m

  # Per-container CPU, memory and restarts. Only the container metrics worth keeping are on: the TCP and disk ones
  # would multiply the series by 50 for nothing the dashboard shows.
  cadvisor:
    <<: *hardened
    image: ghcr.io/google/cadvisor:v0.60.6
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --disable_metrics=disk,diskIO,percpu,referenced_memory,process,sched,tcp,udp,advtcp
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks: [monitoring]
    mem_limit: 192m

  alertmanager:
    <<: *hardened
    image: prom/alertmanager:v0.34.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - alertmanager-data:/alertmanager
      - ./alertmanager:/etc/alertmanager:ro
    secrets: [smtp_password]
    networks: [monitoring]
    mem_limit: 64m
    labels:
      config.hash: ${CONFIG_HASH}

  # My view of the metrics, reachable through an SSH tunnel only (ssh -L 3000:localhost:3000 didelo-vps).
  # The public status page lives outside this server: a page hosted here would go down with it.
  # Datasources and dashboards come from files, so every change goes through git.
  # Traefik routes only the public dashboard to metrics.didelo.fr (ADR 0014): the admin password is for Ansible,
  # which creates that public dashboard through the API, Grafana cannot provision it from a file.
  grafana:
    <<: *hardened
    image: grafana/grafana:13.2.4
    ports:
      - 127.0.0.1:3000:3000
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "true"
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_EXPLORE_ENABLED: "false"
      # The public page tries to open a Grafana Live WebSocket and loads these bundled apps: both fail behind the
      # router and fill the browser console, and neither is used here.
      GF_LIVE_MAX_CONNECTIONS: "0"
      GF_PLUGINS_DISABLE_PLUGINS: grafana-exploretraces-app,grafana-lokiexplore-app,grafana-metricsdrilldown-app,grafana-pyroscope-app
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/overview.json
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 30s
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    secrets: [grafana_admin_password]
    networks: [monitoring, metrics]
    mem_limit: 384m
    labels:
      config.hash: ${CONFIG_HASH}
      traefik.enable: "true"
      traefik.docker.network: metrics
      # Only the public dashboard, its API, the front-end assets and the two calls the page makes at load (the login
      # ping and the list of dashboard API versions: without them an error toast shows). Everything else answers 404:
      # the login, the admin API and the data source proxy never reach the internet. The token is the link of the
      # public dashboard.
      traefik.http.routers.metrics.rule: >-
        Host(`metrics.didelo.fr`) && (PathPrefix(`/public/`) || Path(`/api/login/ping`)
        || Path(`/apis/dashboard.grafana.app/`)
        || PathPrefix(`/public-dashboards/${PUBLIC_DASHBOARD_TOKEN}`)
        || PathPrefix(`/api/public/dashboards/${PUBLIC_DASHBOARD_TOKEN}`))
      # The page posts front-end performance numbers here: Traefik swallows them, they are not worth a route to Grafana.
      traefik.http.routers.metrics-sink.rule: Host(`metrics.didelo.fr`) && Path(`/api/frontend-metrics`)
      traefik.http.routers.metrics-sink.service: ping@internal
      traefik.http.routers.metrics-home.rule: Host(`metrics.didelo.fr`) && Path(`/`)
      traefik.http.routers.metrics-home.middlewares: metrics-home
      traefik.http.middlewares.metrics-home.redirectregex.regex: ^(https?://[^/]+)/$$
      traefik.http.middlewares.metrics-home.redirectregex.replacement: $${1}/public-dashboards/${PUBLIC_DASHBOARD_TOKEN}
      traefik.http.services.metrics.loadbalancer.server.port: "3000"

secrets:
  smtp_password:
    file: ./secrets/smtp_password
  grafana_admin_password:
    file: ./secrets/grafana_admin_password

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:

networks:
  monitoring:
  # Created by the Traefik stack, which starts first.
  crowdsec:
    external: true
  # Traefik and Grafana only: the containers on edge cannot reach Grafana's admin API.
  metrics:
    external: true
