groups:
  - name: availability
    rules:
      - alert: SiteDown
        expr: probe_success{job="probe-http"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} is down"
          description: "The probe for {{ $labels.instance }} has failed for 2 minutes."

      - alert: CertificateExpiresSoon
        # Traefik renews 30 days before expiry: under 14 days left means the renewal is failing.
        expr: (probe_ssl_earliest_cert_expiry{job="probe-http"} - time()) < 14 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Certificate of {{ $labels.instance }} expires soon"
          description: "{{ $labels.instance }} has {{ $value | humanizeDuration }} left on its certificate."

      - alert: SiteSlow
        expr: probe_duration_seconds{job="probe-http"} > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} is slow"
          description: "Probe of {{ $labels.instance }} takes {{ $value | humanizeDuration }}."

      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is not scraped"
          description: "Prometheus cannot scrape {{ $labels.instance }} ({{ $labels.job }})."

  - name: host
    rules:
      - alert: DiskAlmostFull
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk is almost full"
          description: "Less than 10% of the root filesystem is free."

      - alert: MemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Memory is low"
          description: "Less than 10% of the memory is available."

      - alert: CpuHigh
        expr: 100 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100 > 90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "CPU is saturated"
          description: "CPU has been above 90% for 15 minutes."
