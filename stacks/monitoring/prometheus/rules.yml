groups:
  - name: availability
    rules:
      - alert: SiteDown
        expr: probe_success{job=~"probe-http|probe-ws"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} is down"
          description: "The probe for {{ $labels.instance }} has failed for 2 minutes."

      - alert: CertificateExpiresSoon
        # Traefik renews 30 days before expiry: under 14 days left means the renewal is failing.
        expr: (probe_ssl_earliest_cert_expiry{job="probe-http"} - time()) < 14 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Certificate of {{ $labels.instance }} expires soon"
          description: "{{ $labels.instance }} has {{ $value | humanizeDuration }} left on its certificate."

      - alert: SiteSlow
        expr: probe_duration_seconds{job=~"probe-http|probe-ws"} > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} is slow"
          description: "Probe of {{ $labels.instance }} takes {{ $value | humanizeDuration }}."

      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is not scraped"
          description: "Prometheus cannot scrape {{ $labels.instance }} ({{ $labels.job }})."

  - name: host
    rules:
      - alert: DiskAlmostFull
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk is almost full"
          description: "Less than 10% of the root filesystem is free."

      - alert: MemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Memory is low"
          description: "Less than 10% of the memory is available."

      - alert: CpuHigh
        expr: 100 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100 > 90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "CPU is saturated"
          description: "CPU has been above 90% for 15 minutes."

  - name: security
    rules:
      - alert: CrowdSecNotParsing
        # The probes alone write a line to the Traefik access log every few seconds: silence means CrowdSec stopped
        # reading it, or never started. The first line of a fresh start counts, so a restart does not fire it.
        expr: |
          sum(increase(cs_filesource_hits_total{source="/var/log/traefik/access.log"}[15m])) == 0
          or absent(cs_filesource_hits_total{source="/var/log/traefik/access.log"})
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "CrowdSec is not parsing the Traefik access log"
          description: "CrowdSec has read no line of the access log for 15 minutes, so attacks go unseen."

  - name: containers
    rules:
      - alert: ContainerRestarting
        # container_start_time_seconds changes each time a container starts, so this counts the restarts.
        expr: changes(container_start_time_seconds{name!=""}[15m]) >= 3
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }} keeps restarting"
          description: "{{ $labels.name }} restarted {{ $value }} times in 15 minutes."

      - alert: RedisMissing
        # cAdvisor exports no health status, so a Redis that runs and answers nothing is not seen here: only one that is
        # gone, stopped or removed (ADR 0018). The backend does not report it either, its health check leaves Redis out.
        expr: absent(container_last_seen{name="redis-redis-1"})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Redis is not running"
          description: "No Redis container for 2 minutes: the games in progress cannot be saved or shared."

      - alert: PostgresMissing
        # Same limit as for Redis: a Postgres that runs and answers nothing is not seen here, only one that is gone,
        # stopped or removed (ADR 0021). The backend's health check leaves the database out.
        expr: absent(container_last_seen{name="postgres-postgres-1"})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Postgres is not running"
          description: "No Postgres container for 2 minutes: accounts, game history and the leaderboard are unavailable."

      - alert: BackendReplicaMissing
        # A rollout starts the new replica before it removes the old one, so a healthy deploy never goes below two.
        expr: (count(container_last_seen{name=~"semaphore-semaphore-[0-9]+"}) or vector(0)) < 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "A replica of the game's backend is missing"
          description: "Fewer than two backend containers for 5 minutes: players are served by {{ $value }}."
