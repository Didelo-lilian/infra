http:
  middlewares:
    security-headers:
      headers:
        # One year, no preload: preloading is hard to undo.
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        contentTypeNosniff: true
        # SAMEORIGIN instead of frameDeny: Storybook shows its stories in an iframe of its own site. It overrides frameDeny.
        customFrameOptionsValue: SAMEORIGIN
        referrerPolicy: strict-origin-when-cross-origin
        customResponseHeaders:
          # An empty value removes the header, whatever the backend sends.
          Server: ""

tls:
  options:
    default:
      minVersion: VersionTLS12
      sniStrict: true
