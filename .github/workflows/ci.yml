name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - run: tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
      - run: tflint --config "$GITHUB_WORKSPACE/.tflint.hcl"

  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ansible/ansible-lint@b74fb6f73d234bf92672372cb1c10768e4018d16 # v26.11.0
        with:
          working_directory: ansible
          requirements_file: requirements.yml

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make check-scripts

  # The real deploy-app rolling out real images on a throwaway stack (ADR 0019).
  deploy-app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: make test-deploy-app

  # What Traefik sends where on play.didelo.fr, with the real labels of the semaphore stack (ADR 0022).
  semaphore-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: make test-semaphore-edge

  # Which methods the WAF lets through on play.didelo.fr, with the real CrowdSec stack and the real bouncer (ADR 0013).
  crowdsec-waf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: make test-crowdsec-waf

  # The athlete-panel stack with its real image, and the client address that Caddy tells the app (ADR 0023).
  athlete-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: make test-athlete-panel

  monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make check-monitoring

  sops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make check-secrets

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The gitleaks GitHub Action needs a license for organizations; the CLI image does not.
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest git /repo --redact --verbose
