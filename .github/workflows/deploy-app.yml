name: Deploy app

# Rolls out a new image of a stack that already runs, one replica at a time, and puts the previous image back when
# the first replica fails. Unlike Server, it never changes the server's configuration, so it needs no approval:
# see ADR 0009 and ADR 0019.
on:
  workflow_dispatch:
    inputs:
      stack:
        description: Stack to restart on its latest image
        type: choice
        options: [ds, semaphore, play]
        required: true
      soak:
        description: Seconds to watch the first updated replica before the others follow (empty is 120, a single replica has none)
        type: string
        required: false

permissions:
  contents: read

# Its own group: a Server run waiting for approval must not hold back app deploys.
concurrency:
  group: deploy-app-${{ inputs.stack }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Its secret is the restricted key, readable from main only (environment setting).
    environment: apps
    steps:
      - uses: actions/checkout@v7
      # The host key is pinned in the repo, as in Server. The soak is two silent minutes by default: keep the connection
      # alive, a dropped one would kill the script halfway through a rollout.
      - env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          (umask 077; printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy)
          cat > ~/.ssh/config <<CONFIG
          Host didelo-vps
            HostName didelo.fr
            HostKeyAlias didelo-vps
            User deploy
            IdentityFile ~/.ssh/deploy
            IdentitiesOnly yes
            ServerAliveInterval 30
            StrictHostKeyChecking yes
            UserKnownHostsFile $PWD/ansible/known_hosts
          CONFIG
      # The server runs a fixed command and takes the stack name and the soak only as arguments it checks. It exits 1
      # when it put the previous image back, 2 when it could not: either way this step, and so the run, fails.
      - env:
          STACK: ${{ inputs.stack }}
          SOAK: ${{ inputs.soak }}
        run: |
          # shellcheck disable=SC2029 # the arguments are meant to be expanded here
          ssh didelo-vps "$STACK $SOAK"

  # The run is started by an App, so GitHub emails nobody when it fails: an issue assigned to me does.
  alert:
    needs: deploy
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          STACK: ${{ inputs.stack }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --assignee LilianSOLER \
            --title "Deploy app failed for $STACK" \
            --body "The deploy of \`$STACK\` failed. The log says whether the previous image was put back: $RUN_URL"
