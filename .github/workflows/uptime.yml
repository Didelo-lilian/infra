name: Uptime

# The server cannot report its own outage, so this probes it from outside. A failed run emails
# the person who last edited the schedule. Scheduled workflows are paused after 60 days
# without activity on a public repository.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Site answers over HTTPS
        run: curl --fail --silent --show-error --max-time 20 --retry 2 --retry-delay 10 --output /dev/null https://hello.didelo.fr
