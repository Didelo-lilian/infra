version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: terraform
    directory: /terraform
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      providers:
        patterns: ["*"]
  - package-ecosystem: docker-compose
    directories: ["/stacks/*"]
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      # The app's own pull request: an update runs migrations on the owner's data, so it is read and applied alone,
      # after a backup (docs/runbooks/athlete-panel.md). The first group that matches wins.
      athlete-panel:
        patterns: ["ghcr.io/bidulelabs/athlete-panel"]
      images:
        patterns: ["*"]
    ignore:
      # A new major cannot read the data directory of the old one (ADR 0021): upgrading is a migration, not a bump.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /ansible
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
