version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: terraform
    directory: /terraform
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      providers:
        patterns: ["*"]
  - package-ecosystem: docker-compose
    directories: ["/stacks/*"]
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      images:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /ansible
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
