version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: terraform
    directory: /terraform
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      providers:
        patterns: ["*"]
  - package-ecosystem: docker-compose
    directories: ["/stacks/*"]
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      images:
        patterns: ["*"]
    ignore:
      # A new major cannot read the data directory of the old one (ADR 0021): upgrading is a migration, not a bump.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /ansible
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
